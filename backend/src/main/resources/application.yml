spring:
  application:
    name: mura-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mura}
    username: ${SPRING_DATASOURCE_USERNAME:mura}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      demo: false

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          # The development mailbox wants neither, and demanding them would
          # only stop the backend from talking to it.
          auth: false
          starttls:
            enable: false

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: native

mura:
  invitations:
    # How long an invitation stays answerable. Past this it expires and the
    # project can invite the person again.
    lifetime-days: ${INVITATION_LIFETIME_DAYS:14}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MURA_MAIL_FROM:Mura <bonjour@mura.dev>}
  app:
    # The address a link in an email has to land on: the browser, not the API.
    url: ${MURA_APP_URL:http://localhost:5173}

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /api-docs

logging:
  level:
    io.mura: INFO
