spring:
  application:
    name: mura-backend

  messages:
    basename: messages
    fallback-to-system-locale: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mura}
    username: ${SPRING_DATASOURCE_USERNAME:mura}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      demo: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          starttls:
            enable: ${MAIL_STARTTLS:false}
            required: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SSL:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

server:
  port: ${BACKEND_PORT:8080}
  forward-headers-strategy: native

mura:
  admin-email: ${MURA_ADMIN_EMAIL:}
  invitations:
    # How long an invitation stays answerable. Past this it expires and the
    # project can invite the person again.
    lifetime-days: ${INVITATION_LIFETIME_DAYS:14}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  mail:
    from: ${MURA_MAIL_FROM:Mura <bonjour@mura.dev>}
  app:
    # The address a link in an email has to land on: the browser, not the API.
    url: ${MURA_APP_URL:http://localhost:5173}

springdoc:
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
  api-docs:
    enabled: false
    path: /api-docs

logging:
  level:
    io.mura: INFO
