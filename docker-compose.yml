services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches every message the backend sends instead of delivering it, and
  # shows them at http://localhost:8025. Nothing leaves the machine, so a
  # test registration cannot mail a stranger.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_PORT:-1025}:1025"

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${MURA_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      SPRING_MAIL_HOST: mail
      SPRING_MAIL_PORT: 1025
      MURA_MAIL_FROM: ${MURA_MAIL_FROM:-Mura <bonjour@mura.dev>}
      # Where a link in an email has to land: the browser, not the API.
      MURA_APP_URL: ${MURA_URL:-http://localhost:${FRONTEND_PORT:-5173}}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      # Baked into the pages at build time, which is why they are build
      # arguments rather than environment: who runs this instance, for its
      # Mentions légales and privacy policy. All optional; see .env.example.
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_LEGAL_PUBLISHER_NAME: ${VITE_LEGAL_PUBLISHER_NAME:-}
        VITE_LEGAL_PUBLISHER_ADDRESS: ${VITE_LEGAL_PUBLISHER_ADDRESS:-}
        VITE_LEGAL_CONTACT_EMAIL: ${VITE_LEGAL_CONTACT_EMAIL:-}
        VITE_LEGAL_PUBLICATION_DIRECTOR: ${VITE_LEGAL_PUBLICATION_DIRECTOR:-}
        VITE_LEGAL_HOST_NAME: ${VITE_LEGAL_HOST_NAME:-}
        VITE_LEGAL_HOST_ADDRESS: ${VITE_LEGAL_HOST_ADDRESS:-}
        VITE_LEGAL_HOST_PHONE: ${VITE_LEGAL_HOST_PHONE:-}
        VITE_LEGAL_PRIVACY_CONTACT: ${VITE_LEGAL_PRIVACY_CONTACT:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
