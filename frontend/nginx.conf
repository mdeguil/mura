server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # Scripts and styles only from this origin, never inline: an injected
        # <script> does not run. The page cannot be framed by another site,
        # and the API is only reached on this origin (a VITE_API_URL served
        # elsewhere has to be added to connect-src).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Proxy API calls to backend; Spring Security sets its own headers there
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
